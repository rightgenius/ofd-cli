# Release workflow
#
# Triggered on push of a tag matching v*. Builds platform-specific native
# binaries + the fat-jar, then creates/updates a GitHub release with all
# artifacts attached.
#
# Native-image is platform-bound: each OS/arch combination needs its
# own runner. macOS arm64 is the most-requested (most users have M-series
# Macs). Linux x86_64 is the second-most-requested. Windows is future
# work.
#
# To cut a release:
#   git tag v0.1.0
#   git push origin v0.1.0
# Then this workflow runs and creates the GitHub release automatically.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # needed for softprops/action-gh-release to create releases

jobs:
  # ----- Build macOS arm64 (Apple Silicon, most common) -----
  build-macos-arm64:
    name: Build (macOS arm64)
    runs-on: macos-14   # Apple Silicon
    timeout-minutes: 30

    steps:
      - name: Checkout ofd-cli
        uses: actions/checkout@v4

      # The ofd-cli pom pulls `com.github.rightgenius:ofdrw-full` etc. from
      # JitPack, but JitPack auth/availability is flaky for public forks.
      # Build the fork locally and install it into ~/.m2 under the
      # com.github.rightgenius coordinate so the build never touches JitPack.
      - name: Build ofdrw fork (2.4.0-openpdf.2) and install to local m2
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.4.0-openpdf.2 \
            https://github.com/rightgenius/ofdrw.git /tmp/ofdrw-fork
          cd /tmp/ofdrw-fork
          # parent pom already pins <version>2.4.0-openpdf.2</version>. Note:
          # the fork's feature/openpdf-replacement branch doesn't include the
          # upstream ofdrw-pdfbox module, so we don't pass -pl exclusions.
          mvn -B -DskipTests -Dgpg.skip=true install
          # Install ofdrw-full meta-jar under the com.github.rightgenius
          # coordinate the ofd-cli pom actually pulls.
          cat > /tmp/ofdrw-full-pom.xml <<'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.github.rightgenius</groupId>
            <artifactId>ofdrw-full</artifactId>
            <version>2.4.0-openpdf.2</version>
            <packaging>jar</packaging>
            <dependencies>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-core</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-gv</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-gm</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-converter</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-sign</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-layout</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-crypto</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-font</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-pkg</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-tool</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-reader</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-archive</artifactId><version>2.4.0-openpdf.2</version></dependency>
            </dependencies>
          </project>
          POM
          mvn -B install:install-file \
            -Dfile=/tmp/ofdrw-fork/ofdrw-full/target/ofdrw-full-2.4.0-openpdf.2.jar \
            -DpomFile=/tmp/ofdrw-full-pom.xml
          # ofdrw-crypto is a separate module the ofd-cli pom also pulls
          # under the com.github.rightgenius coordinate — install it too.
          mvn -B install:install-file \
            -Dfile=/tmp/ofdrw-fork/ofdrw-crypto/target/ofdrw-crypto-2.4.0-openpdf.2.jar \
            -DgroupId=com.github.rightgenius \
            -DartifactId=ofdrw-crypto \
            -Dversion=2.4.0-openpdf.2 \
            -Dpackaging=jar

      - name: Set up GraalVM JDK 25
        run: |
          # setup-graalvm@v1 only ships with LTS releases baked in
          # (jdk-21.0.2, jdk-25.0.2 as of v1.6.4). 21.0.2 doesn't emit
          # lib*.dylib on macOS arm64 native-image; jdk-25.0.2 emits them
          # but System.loadLibrary("awt") inside the binary can't find
          # them at runtime because of a known GraalVM 25.0.2 closed-world
          # regression with AWT (see the runtime error in test logs).
          # graal-25.2.4 (tagged with JDK level 25.0.4) fixes both. Pull
          # the tarball directly to avoid fighting setup-graalvm's
          # release-list resolution.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ASSET="graalvm-community-jdk-25i2-25.0.4_macos-aarch64_bin.tar.gz"
          else
            ASSET="graalvm-community-jdk-25i2-25.0.4_linux-x64_bin.tar.gz"
          fi
          echo "→ Downloading GraalVM $ASSET"
          curl -fsSL -o /tmp/graal.tar.gz \
            "https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.2.4/$ASSET"
          mkdir -p "$HOME/graalvm"
          tar -xzf /tmp/graal.tar.gz -C "$HOME/graalvm"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "JAVA_HOME=$HOME/graalvm/graalvm-community-openjdk-25.0.4+10.1/Contents/Home" >> $GITHUB_ENV
          else
            echo "JAVA_HOME=$HOME/graalvm/graalvm-community-openjdk-25.0.4+10.1" >> $GITHUB_ENV
          fi
          echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV
          echo "→ Installed GraalVM at $JAVA_HOME"
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/native-image" --version

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build fat-jar
        run: mvn -B package -DskipTests

      - name: Build native binary
        run: mvn -B package -Pnative -DskipTests

      - name: Smoke-test native binary
        run: |
          ./target/ofd --version
          ./target/ofd --help > /dev/null
          echo "OK"

      - name: Stage binary + dylibs into a platform-specific subdirectory
        run: |
          # native-image leaves lib*.dylib siblings of the binary in target/.
          # These are loaded at runtime via System.loadLibrary(); the macOS
          # loader only finds them in the binary's own directory, so we
          # package the binary and dylibs into target/ofd-darwin-arm64/.
          # (We can't just `mv target/ofd target/ofd-darwin-arm64/` first
          # because then mkdir ofd-darwin-arm64 would conflict with the
          # file of the same name; do everything inside one shell so the
          # rename-to-dir step is atomic.)
          #
          # Newer GraalVM versions (>= 25.0) may build a statically-linked
          # binary that doesn't emit lib*.dylib siblings; that's fine —
          # the system AWT libs are loaded from the JVM install dir.
          mkdir target/ofd-darwin-arm64
          mv target/ofd target/ofd-darwin-arm64/ofd-darwin-arm64
          shopt -s nullglob
          cp target/lib*.dylib target/ofd-darwin-arm64/ 2>/dev/null || true
          # GraalVM 25.0.2 native-image on macOS arm64 doesn't emit lib*.dylib
          # siblings, so we copy the runtime libs out of the JDK install that
          # setup-graalvm prepared for us. Without these, the binary crashes
          # with UnsatisfiedLinkError("No awt in java.library.path") at
          # the first touch of any java.awt.Font / AWT class.
          if compgen -G "$JAVA_HOME/lib/"*.dylib > /dev/null; then
            cp "$JAVA_HOME/lib/"libawt.dylib "$JAVA_HOME/lib/"libawt_lwawt.dylib \
               "$JAVA_HOME/lib/"libfontmanager.dylib "$JAVA_HOME/lib/"libfreetype.dylib \
               "$JAVA_HOME/lib/"libjava.dylib "$JAVA_HOME/lib/"libjavajpeg.dylib \
               "$JAVA_HOME/lib/"libjvm.dylib "$JAVA_HOME/lib/"liblcms.dylib \
               "$JAVA_HOME/lib/"libmlib_image.dylib "$JAVA_HOME/lib/"libosxapp.dylib \
               target/ofd-darwin-arm64/ 2>/dev/null || true
          fi
          ls -la target/ofd-darwin-arm64/

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: ofd-darwin-arm64
          path: target/ofd-darwin-arm64
          if-no-files-found: error

      - name: Upload fat-jar
        uses: actions/upload-artifact@v4
        with:
          name: ofd-cli-jar
          path: target/ofd-cli.jar
          if-no-files-found: error

  # ----- Build Linux x86_64 -----
  build-linux-x64:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout ofd-cli
        uses: actions/checkout@v4

      - name: Build ofdrw fork (2.4.0-openpdf.2) and install to local m2
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.4.0-openpdf.2 \
            https://github.com/rightgenius/ofdrw.git /tmp/ofdrw-fork
          cd /tmp/ofdrw-fork
          mvn -B -DskipTests -Dgpg.skip=true install
          cat > /tmp/ofdrw-full-pom.xml <<'POM'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.github.rightgenius</groupId>
            <artifactId>ofdrw-full</artifactId>
            <version>2.4.0-openpdf.2</version>
            <packaging>jar</packaging>
            <dependencies>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-core</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-gv</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-gm</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-converter</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-sign</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-layout</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-crypto</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-font</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-pkg</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-tool</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-reader</artifactId><version>2.4.0-openpdf.2</version></dependency>
              <dependency><groupId>org.ofdrw</groupId><artifactId>ofdrw-archive</artifactId><version>2.4.0-openpdf.2</version></dependency>
            </dependencies>
          </project>
          POM
          mvn -B install:install-file \
            -Dfile=/tmp/ofdrw-fork/ofdrw-full/target/ofdrw-full-2.4.0-openpdf.2.jar \
            -DpomFile=/tmp/ofdrw-full-pom.xml
          # ofdrw-crypto is a separate module the ofd-cli pom also pulls
          # under the com.github.rightgenius coordinate — install it too.
          mvn -B install:install-file \
            -Dfile=/tmp/ofdrw-fork/ofdrw-crypto/target/ofdrw-crypto-2.4.0-openpdf.2.jar \
            -DgroupId=com.github.rightgenius \
            -DartifactId=ofdrw-crypto \
            -Dversion=2.4.0-openpdf.2 \
            -Dpackaging=jar

      - name: Set up GraalVM JDK 25
        run: |
          # See macOS job for full comment; same setup here.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            ASSET="graalvm-community-jdk-25i2-25.0.4_macos-aarch64_bin.tar.gz"
          else
            ASSET="graalvm-community-jdk-25i2-25.0.4_linux-x64_bin.tar.gz"
          fi
          echo "→ Downloading GraalVM $ASSET"
          curl -fsSL -o /tmp/graal.tar.gz \
            "https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.2.4/$ASSET"
          mkdir -p "$HOME/graalvm"
          tar -xzf /tmp/graal.tar.gz -C "$HOME/graalvm"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            echo "JAVA_HOME=$HOME/graalvm/graalvm-community-openjdk-25.0.4+10.1/Contents/Home" >> $GITHUB_ENV
          else
            echo "JAVA_HOME=$HOME/graalvm/graalvm-community-openjdk-25.0.4+10.1" >> $GITHUB_ENV
          fi
          echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV
          "$JAVA_HOME/bin/java" -version
          "$JAVA_HOME/bin/native-image" --version

      - name: Install basic CJK fonts (for native-image FontLoader scan)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra
          # Sanity: confirm a few font files exist
          ls /usr/share/fonts/opentype/noto/ 2>/dev/null | head -3

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Build fat-jar
        run: mvn -B package -DskipTests

      - name: Build native binary
        run: mvn -B package -Pnative -DskipTests

      - name: Smoke-test native binary
        run: |
          ./target/ofd --version
          ./target/ofd --help > /dev/null
          echo "OK"

      - name: Stage binary + dylibs into a platform-specific subdirectory
        run: |
          # native-image leaves lib*.so siblings of the binary in target/.
          # These are loaded at runtime via System.loadLibrary(). On Linux
          # the loader can find them via LD_LIBRARY_PATH or rpath, but we
          # still package them alongside the binary so the install script
          # can drop them in ~/.local/bin/ next to the executable.
          mkdir target/ofd-linux-x64
          mv target/ofd target/ofd-linux-x64/ofd-linux-x64
          cp target/lib*.so target/ofd-linux-x64/ 2>/dev/null || true
          ls -la target/ofd-linux-x64/

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: ofd-linux-x64
          path: target/ofd-linux-x64
          if-no-files-found: error

  # ----- Create the GitHub release with all artifacts -----
  release:
    name: Create GitHub Release
    needs: [build-macos-arm64, build-linux-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show what we got
        run: |
          ls -lh dist/
          echo "---"
          ls -lh dist/ofd-darwin-arm64/
          file dist/ofd-darwin-arm64/ofd-darwin-arm64 2>/dev/null || true
          file dist/ofd-linux-x64/ofd-linux-x64    2>/dev/null || true

      - name: Generate checksums (basename only — install.sh greps by name)
        working-directory: dist
        run: |
          # find gives paths like `./ofd-darwin-arm64/ofd-darwin-arm64`.
          # Strip the directory portion so SHA256SUMS has lines like:
          #   abc123...  ofd-darwin-arm64
          # which is what install.sh's `grep -E "[[:space:]]${ASSET_NAME}\$"` matches.
          find . -type f -not -name SHA256SUMS -exec sha256sum {} \; \
            | sed -E 's|^([a-f0-9]+)  \./([^/]+)/([^/]+)$|\1  \3|' \
            | tee SHA256SUMS

      - name: Create / update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          # Note: libawt.dylib, libfontmanager.dylib etc. are uploaded as
          # separate assets because the native binary calls
          # System.loadLibrary("awt") etc. at runtime and macOS's loader
          # only finds them via LC_LOAD_DYLIB in the binary's own directory.
          # install.sh downloads them alongside ofd and chmods them.
          #
          # Newer GraalVM versions (>= 25.0) build statically-linked macOS
          # binaries that don't emit lib*.dylib siblings, so we don't fail
          # on unmatched globs — those entries are skipped.
          files: |
            dist/ofd-darwin-arm64/ofd-darwin-arm64
            dist/ofd-darwin-arm64/lib*.dylib
            dist/ofd-darwin-arm64/lib*.so
            dist/ofd-linux-x64/ofd-linux-x64
            dist/ofd-linux-x64/lib*.so
            dist/ofd-cli-jar/ofd-cli.jar
            dist/SHA256SUMS
          fail_on_unmatched_files: false
